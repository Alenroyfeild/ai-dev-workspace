name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.2.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Archive and validate the selected tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo "Tag commit is not reachable from origin/main"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-src"
          git archive "$commit" | tar -x -C "$RUNNER_TEMP/release-src"
          python bin/verify-publish-tag "$RELEASE_TAG" "$RUNNER_TEMP/release-src"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$commit")" >> "$GITHUB_ENV"
      - name: Build from the tag archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'build==1.2.2.post1' 'setuptools==75.8.2' 'wheel==0.45.1'
          cd "$RUNNER_TEMP/release-src"
          python -m build --no-isolation
          python "$GITHUB_WORKSPACE/bin/normalize-sdist" dist/*.tar.gz "$SOURCE_DATE_EPOCH"
          sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: ${{ runner.temp }}/release-src/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist/
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

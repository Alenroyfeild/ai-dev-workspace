name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match kit.json version
        run: |
          v=$(python3 -c "import json;print(json.load(open('kit.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "kit.json says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - run: python3 -m unittest discover -s tests
      - name: Release notes from CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v "([[:space:]]|$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $v"; exit 1; }
          printf '\n### Upgrade\n- pipx: `pipx upgrade ai-dev-workspace` (or `pipx install --force git+https://github.com/%s@%s`)\n- Git clone: `ws update`\n- Then `ws upgrade --dry-run` in each workspace to see template changes.\n\nFull history: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      # Published as Latest, not pre-release: installs before beta.3 only see releases/latest.
      - name: Publish (updates notes if the release already exists)
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --prerelease=false --latest \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
        env: {GH_TOKEN: "${{ github.token }}"}

name: test
on:
  push:
    branches: [dev, main]  # feature branches are tested through their pull request, once per commit
  pull_request:
  workflow_dispatch:
concurrency:  # a newer commit on a PR cancels its older run; push runs get their own group (run_id), so no dev/main run is ever replaced
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:  # docs-only PRs test on Ubuntu only; every code PR, push to dev/main and `full-ci` label runs the whole matrix
    runs-on: ubuntu-latest
    outputs: {full: "${{ steps.c.outputs.full }}"}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - id: c
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" = true ]; then
            echo full=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(README\.md|CHANGELOG\.md|llms(-full)?\.txt|docs/|changelog\.d/)'; then
            echo full=false >> "$GITHUB_OUTPUT"
          else
            echo full=true >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: changes
    # ubuntu-latest became 26.04, which has no Python 3.9; run that one leg on 24.04 and keep the required check name
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.9') && 'ubuntu-24.04' || matrix.os }}
    env:  # the six required checks still report; on a docs-only PR the macOS/Windows ones pass without running tests
      RUN_TESTS: ${{ needs.changes.outputs.full == 'true' || matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - if: env.RUN_TESTS != 'true'
        run: echo "Docs-only PR, so this OS is skipped here; the full matrix runs after merge on dev."
      - if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v7
      - if: env.RUN_TESTS == 'true'
        uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - name: Temporary Python 3.14 baseline classification
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          baseline=$(mktemp -d)
          git archive "$BASE_SHA" | tar -x -C "$baseline"
          export HOME="$(mktemp -d)" WS_OFFLINE=1 PYTHONDONTWRITEBYTECODE=1
          cd "$baseline"
          for pattern in test_windows_hardening2.py test_hunt2_guards.py test_plugin_runtime.py test_undo_clean.py; do
            echo "Baseline $BASE_SHA $pattern:"
            set +e
            python -m unittest discover -s tests -p "$pattern" > "$RUNNER_TEMP/$pattern.log" 2>&1
            rc=$?
            set -e
            echo "exit=$rc"
            grep -E '^FAIL:|^ERROR:|^Ran |^FAILED|^OK|^AssertionError:|SyntaxWarning|^  File ' "$RUNNER_TEMP/$pattern.log" || true
          done
      - if: env.RUN_TESTS == 'true' && runner.os == 'Windows'
        run: chcp 65001
      - if: env.RUN_TESTS == 'true'
        run: python -m unittest discover -s tests -v
        env: {PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8"}
      - name: Shallow checkout, offline, minimal PATH
        if: env.RUN_TESTS == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          python_path="$(command -v python)"
          PATH=/usr/bin:/bin WS_OFFLINE=1 "$python_path" -m unittest discover -s tests
        env: {PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8"}

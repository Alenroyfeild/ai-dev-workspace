name: test
on:
  push:
    branches: [dev, main]  # feature branches are tested through their pull request, once per commit
  pull_request:
  workflow_dispatch:
concurrency:  # a newer commit on a PR cancels its older run; dev/main runs always finish (post-merge CI)
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - if: runner.os == 'Windows'
        run: chcp 65001
      - run: python -m unittest discover -s tests -v
        env: {PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8"}
      - name: Shallow checkout, offline, minimal PATH
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python_path="$(command -v python)"
          PATH=/usr/bin:/bin WS_OFFLINE=1 "$python_path" -m unittest discover -s tests
        env: {PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8"}

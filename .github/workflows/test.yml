# Measurement-only branch for CI2. DO NOT MERGE this workflow into dev/main.
name: test
on:
  workflow_dispatch:
jobs:
  test:
    name: CI2 Windows 3.12 durations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Full suite with isolated HOME and per-test durations
        shell: pwsh
        env: {PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8"}
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'ci2-home'
          New-Item -ItemType Directory -Force $fixtureRoot | Out-Null
          $env:HOME = $fixtureRoot
          $env:USERPROFILE = $fixtureRoot
          $env:CODEX_HOME = Join-Path $fixtureRoot '.codex'
          $env:CLAUDE_CONFIG_DIR = Join-Path $fixtureRoot '.claude'
          $env:GEMINI_CONFIG_DIR = Join-Path $fixtureRoot '.gemini'
          $env:XDG_CONFIG_HOME = Join-Path $fixtureRoot '.config'
          python -m unittest discover -s tests --durations 25
          exit $LASTEXITCODE

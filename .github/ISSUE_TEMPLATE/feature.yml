name: Feature request
description: Describe a problem you want ws to solve (about 1 minute).
title: "[idea] "
labels:
  - feedback
  - idea
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. Redact secrets and private data.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands, packs or workarounds, and why they fell short.
    validations:
      required: false
  - type: dropdown
    id: assistant
    attributes:
      label: Which assistant? (optional)
      options:
        - Claude Code
        - Codex
        - Cursor
        - Copilot
        - Gemini CLI
        - Other
    validations:
      required: false

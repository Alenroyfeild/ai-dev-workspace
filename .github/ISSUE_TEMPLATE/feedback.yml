name: Something confused me
description: Tell us what you were trying to do and what felt confusing (about 30 seconds).
title: "[feedback] "
labels:
  - feedback
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - friction
        - idea
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What were you trying to do, and what confused you?
      description: One sentence is enough. Redact secrets and private data.
      placeholder: I tried …, but …
    validations:
      required: true
  - type: input
    id: recorded
    attributes:
      label: Recorded date (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: kit_version
    attributes:
      label: Kit version (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: packs
    attributes:
      label: Enabled packs (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false

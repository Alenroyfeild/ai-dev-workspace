name: Something broke
description: Report a crash, error or unexpected result (about 30 seconds).
title: "[bug] "
labels:
  - feedback
  - bug
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - bug
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What happened?
      description: Include the command or error if handy. Redact secrets and private data.
      placeholder: I ran … and got …; I expected …
    validations:
      required: true
  - type: input
    id: recorded
    attributes:
      label: Recorded date (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: kit_version
    attributes:
      label: Kit version (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: packs
    attributes:
      label: Enabled packs (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false

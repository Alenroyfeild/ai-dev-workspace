name: Something broke
description: Report a crash, error or unexpected result (about 30 seconds).
title: "[bug] "
labels:
  - feedback
  - bug
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - bug
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What happened?
      description: Say what happened, the steps to repeat it, and what you expected. Include the command or error if handy. Redact secrets and private data.
      placeholder: "Steps: 1. I ran … 2. … Got: … Expected: …"
    validations:
      required: true
  - type: input
    id: recorded
    attributes:
      label: Recorded date (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: kit_version
    attributes:
      label: Kit version (optional)
      description: Output of `ws version`. Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: packs
    attributes:
      label: Enabled packs (optional)
      description: Filled automatically by ws feedback submit.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system (optional)
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: false
  - type: dropdown
    id: assistant
    attributes:
      label: Which assistant? (optional)
      options:
        - Claude Code
        - Codex
        - Cursor
        - Copilot
        - Gemini CLI
        - Other
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ws doctor --text` (optional)
      description: Remove private paths and names before pasting.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private details (paths, company names, secrets).
          required: true
